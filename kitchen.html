<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าจอห้องครัว - Fennec Fox Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background: #1e1e2f; color: #fff; padding: 20px; }
        h1, h2 { color: #ff9f43; margin-bottom: 10px; }
        .section-box { background: #2a2a3d; padding: 15px; border-radius: 10px; margin-bottom: 25px; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
        .order-card { background: #2d2d44; border-radius: 12px; padding: 15px; border-left: 6px solid #ff9f43; position: relative; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .order-items { margin: 15px 0; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: 'Prompt'; margin-top: 5px; }
        .btn-cook { background: #ff9f43; color: #fff; }
        .btn-done { background: #28a745; color: #fff; }
        .btn-print { background: #17a2b8; color: #fff; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: #444; }
        
        /* สไตล์เมนูของหมด */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .stock-item { background: #3b3b54; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .toggle-btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Prompt'; font-weight: bold; }
        .in-stock { background: #28a745; color: white; }
        .out-stock { background: #dc3545; color: white; }

        /* สไตล์ใบสลิปสำหรับการพิมพ์ */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 10px; }
        }
    </style>
</head>
<body>

    <button onclick="enableAudio()" style="float: right; padding: 8px 15px; background: #ff9f43; border: none; border-radius: 5px; cursor: pointer; font-family: Prompt;">🔊 เปิดเสียงเตือน</button>
    <h1>👨‍🍳 จอแสดงรายการอาหารในครัว</h1>

    <!-- แผงปิด/เปิดเมนูอาหาร (สินค้าหมด) -->
    <div class="section-box">
        <h2>📦 จัดการวัตถุดิบ / สินค้าหมด</h2>
        <div class="stock-grid" id="stock-container"></div>
    </div>
    
    <!-- แผงรายการออเดอร์ -->
    <div class="section-box">
        <h2>📥 รายการออเดอร์ที่เข้ามา</h2>
        <div class="orders-grid" id="kitchen-orders"></div>
    </div>

    <!-- 🟢 วางโค้ดใหม่ตรงนี้ 🟢 -->
    <div class="section-box">
        <h2>🧹 เช็คบิล / ล้างออเดอร์ประจำโต๊ะ</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <!-- เพิ่มปุ่มตามจำนวนโต๊ะที่มีในร้านได้เลย -->
            <button onclick="clearTable('โต๊ะ 1')" class="btn" style="background: #dc3545; width: auto; padding: 10px 20px;">เช็คบิล โต๊ะ 1</button>
            <button onclick="clearTable('โต๊ะ 2')" class="btn" style="background: #dc3545; width: auto; padding: 10px 20px;">เช็คบิล โต๊ะ 2</button>
            <button onclick="clearTable('โต๊ะ 3')" class="btn" style="background: #dc3545; width: auto; padding: 10px 20px;">เช็คบิล โต๊ะ 3</button>
            <button onclick="clearTable('สั่งกลับบ้าน')" class="btn" style="background: #6c757d; width: auto; padding: 10px 20px;">เคลียร์คิว สั่งกลับบ้าน</button>
        </div>
    </div>
    <!-- 🟢 สิ้นสุดโค้ดใหม่ 🟢 -->

    <!-- ซ่อนพื้นที่พิมพ์สลิป (อันเดิม) -->
    <div id="print-area"></div>

    <!-- ซ่อนพื้นที่พิมพ์สลิป -->
    <div id="print-area"></div>

    <script>
        let previousOrderCount = 0;
        let audioContextAllowed = false;

        // ระบบสร้างเสียงเตือน (Web Audio API)
        function playAlertSound() {
            try {
            // ดึงไฟล์เสียงกระดิ่งจากภายนอก
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play().catch(e => console.log("Audio play failed:", e));
        } catch(e) {
            console.log("Audio error:", e);
        }
    }

        function enableAudio() {
            audioContextAllowed = true;
            playAlertSound();
            alert("เปิดระบบเสียงเตือนเรียบร้อยแล้วค่ะ!");
        }

        // ดึงเมนูมาจัดการสถานะของหมด
        async function fetchStockItems() {
            const res = await fetch('/api/menus');
            const menus = await res.json();
            const container = document.getElementById('stock-container');
            container.innerHTML = '';

            menus.forEach(item => {
                const div = document.createElement('div');
                div.className = 'stock-item';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <button class="toggle-btn ${item.isAvailable ? 'in-stock' : 'out-stock'}" onclick="toggleStock(${item.id})">
                        ${item.isAvailable ? 'มีสินค้า' : 'หมด'}
                    </button>
                `;
                container.appendChild(div);
            });
        }

        async function toggleStock(id) {
            await fetch(`/api/menus/${id}/toggle`, { method: 'PUT' });
            fetchStockItems();
        }

        // ดึงรายการออเดอร์
        async function fetchKitchenOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                
                // ตรวจจับออเดอร์ใหม่เพื่อเล่นเสียงเตือน
                if (orders.length > previousOrderCount) {
                    if (previousOrderCount !== 0 && audioContextAllowed) {
                        playAlertSound();
                    }
                    previousOrderCount = orders.length;
                }

                const container = document.getElementById('kitchen-orders');
                container.innerHTML = '';

                orders.slice().reverse().forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.style.borderColor = order.status === 'completed' ? '#28a745' : (order.status === 'cooking' ? '#ff9f43' : '#e74c3c');

                    let itemsHtml = order.items.map(i => `
                        <div class="item-row">
                            <span>${i.name}</span>
                            <b>x${i.quantity}</b>
                        </div>
                    `).join('');

                    let actionBtn = '';
                    if (order.status === 'pending') {
                        actionBtn = `<button class="btn btn-cook" onclick="updateStatus(${order.id}, 'cooking')">🔥 เริ่มปรุงอาหาร</button>`;
                    } else if (order.status === 'cooking') {
                        actionBtn = `<button class="btn btn-done" onclick="updateStatus(${order.id}, 'completed')">✅ ทำเสร็จแล้ว / เสิร์ฟ</button>`;
                    } else {
                        actionBtn = `<div style="text-align:center; color:#28a745; font-weight:bold; margin-top:5px;">เสิร์ฟเรียบร้อยแล้ว</div>`;
                    }

                    card.innerHTML = `
                        <div class="order-header">
                            <div><b>ออเดอร์ #${order.id} (${order.table})</b></div>
                            <span class="tag">${order.diningOption === 'eat-in' ? '🍽️ ทานที่ร้าน' : '🛍️ กลับบ้าน'}</span>
                        </div>
                        <p style="font-size:0.85rem; color:#aaa; margin:5px 0;">เวลา: ${order.time} | ชำระ: ${order.paymentMethod}</p>
                        <div class="order-items">${itemsHtml}</div>
                        ${actionBtn}
                        <button class="btn btn-print" onclick="printReceipt(${order.id})">🖨️ พิมพ์ใบสลิป</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStatus(id, newStatus) {
            await fetch(`/api/orders/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchKitchenOrders();
        }

        // ฟังก์ชันพิมพ์ใบสั่งอาหาร (Receipt Printer)
        async function printReceipt(orderId) {
            const res = await fetch(`/api/orders/${orderId}`);
            const order = await res.json();
            
            const printArea = document.getElementById('print-area');
            let itemsList = order.items.map(i => `<tr><td>${i.name} x${i.quantity}</td><td style="text-align:right;">${i.price * i.quantity}.-</td></tr>`).join('');
            
            printArea.innerHTML = `
                <div style="width: 250px; font-family: monospace; font-size: 12px;">
                    <h3 style="text-align:center; margin:0;">Fennec Fox Cafe</h3>
                    <p style="text-align:center; margin:2px 0;">--------------------------------</p>
                    <p><b>ออเดอร์: #${order.id}</b> | <b>${order.table}</b></p>
                    <p>ประเภท: ${order.diningOption === 'eat-in' ? 'ทานที่ร้าน' : 'สั่งกลับบ้าน'}</p>
                    <p>เวลา: ${order.time}</p>
                    <p style="text-align:center; margin:2px 0;">--------------------------------</p>
                    <table style="width:100%;">${itemsList}</table>
                    <p style="text-align:center; margin:2px 0;">--------------------------------</p>
                    <p style="font-size: 14px;"><b>ราคารวมทั้งสิ้น: ${order.totalPrice} บาท</b></p>
                    <p>การชำระเงิน: ${order.paymentMethod}</p>
                </div>
            `;
            window.print();
        }

        setInterval(fetchKitchenOrders, 3000);
        fetchStockItems();
        fetchKitchenOrders();

        async function clearTable(tableName) {
    if (!confirm(`ต้องการเช็คบิลและล้างออเดอร์ของ "${tableName}" ใช่ไหม?`)) return;
    
    try {
        const res = await fetch(`/api/orders/clear/${encodeURIComponent(tableName)}`, { method: 'DELETE' });
        if (res.ok) {
            alert(`ล้างข้อมูล ${tableName} เรียบร้อย พร้อมรับลูกค้าใหม่!`);
            // ให้รีเฟรชหน้า หรือเรียกฟังก์ชันโหลดออเดอร์ครัวใหม่
            location.reload(); 
        }
    } catch (err) {
        alert("เกิดข้อผิดพลาด ไม่สามารถล้างโต๊ะได้");
    }
}

    </script>
</body>
</html>
