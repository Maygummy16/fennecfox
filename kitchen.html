<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าจอห้องครัว - Fennec Fox Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
    <style>

    .cat-tab-btn {
    padding: 8px 15px; background: #3b3b54; color: #fff;
    border: 1px solid #555; border-radius: 20px;
    cursor: pointer; font-family: 'Prompt'; transition: 0.2s;
}
.cat-tab-btn.active, .cat-tab-btn:hover {
    background: #ff9f43; border-color: #ff9f43; color: #000; font-weight: bold;
}
.category-container {
    display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;
}

        .table-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
.table-block {
    width: 60px; height: 60px;
    background: #fff; color: #dc3545;
    font-size: 24px; font-weight: bold; font-family: 'Prompt';
    border-radius: 12px; border: 2px solid #dc3545;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: 0.2s;
}
.table-block:hover { background: #dc3545; color: #fff; transform: scale(1.05); }

.modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
    z-index: 1000; backdrop-filter: blur(3px);
}
.bill-modal-content {
    background: #fff; color: #000; width: 90%; max-width: 400px;
    border-radius: 16px; padding: 25px; position: relative;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
.close-modal-btn {
    position: absolute; top: 15px; right: 15px;
    background: #f3f4f6; border: none; width: 32px; height: 32px;
    border-radius: 50%; font-size: 16px; color: #666;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.close-modal-btn:hover { background: #e5e7eb; color: #333; }
.bill-items-container {
    max-height: 250px; overflow-y: auto; padding-right: 5px;
}
.bill-item-row {
    display: flex; justify-content: space-between;
    margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 8px; font-size: 15px;
}

        body { font-family: 'Prompt', sans-serif; background: #1e1e2f; color: #fff; padding: 20px; }
        h1, h2 { color: #ff9f43; margin-bottom: 10px; }
        .section-box { background: #2a2a3d; padding: 15px; border-radius: 10px; margin-bottom: 25px; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 15px; }
        .order-card { background: #2d2d44; border-radius: 12px; padding: 15px; border-left: 6px solid #ff9f43; position: relative; }
        .order-header { display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .order-items { margin: 15px 0; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: 'Prompt'; margin-top: 5px; }
        .btn-cook { background: #ff9f43; color: #fff; }
        .btn-done { background: #28a745; color: #fff; }
        .btn-print { background: #17a2b8; color: #fff; }
        .tag { padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: #444; }
        
        /* สไตล์เมนูของหมด */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .stock-item { background: #3b3b54; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .toggle-btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Prompt'; font-weight: bold; }
        .in-stock { background: #28a745; color: white; }
        .out-stock { background: #dc3545; color: white; }

        /* สไตล์ใบสลิปสำหรับการพิมพ์ */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 10px; }
        }
    </style>
</head>
<body>

    <button onclick="enableAudio()" style="float: right; padding: 8px 15px; background: #ff9f43; border: none; border-radius: 5px; cursor: pointer; font-family: Prompt;">🔊 เปิดเสียงเตือน</button>
    <h1>👨‍🍳 จอแสดงรายการอาหารในครัว</h1>

    <!-- แผงปิด/เปิดเมนูอาหาร (สินค้าหมด) -->
    <!-- แผงปิด/เปิดเมนูอาหาร (สินค้าหมด) -->
    <div class="section-box">
        <h2>📦 จัดการวัตถุดิบ / สินค้าหมด</h2>
        <div id="stock-category-buttons" class="category-container"></div>
        <div class="stock-grid" id="stock-container"></div>
    </div>
    
    <!-- แผงรายการออเดอร์ -->
    <div class="section-box">
        <h2>📥 รายการออเดอร์ที่เข้ามา</h2>
        <div class="orders-grid" id="kitchen-orders"></div>
    </div>

    <!-- 🟢 วางโค้ดใหม่ตรงนี้ 🟢 -->
    <div class="section-box">
    <h2>🧹 เช็คบิล / ล้างออเดอร์ประจำโต๊ะ</h2>
    <div class="table-grid">
        <button class="table-block" onclick="openBillModal('โต๊ะ 1')">1</button>
        <button class="table-block" onclick="openBillModal('โต๊ะ 2')">2</button>
        <button class="table-block" onclick="openBillModal('โต๊ะ 3')">3</button>
        <button class="table-block" onclick="openBillModal('โต๊ะ 4')">1</button>
        <button class="table-block" onclick="openBillModal('โต๊ะ 5')">2</button>
        <button class="table-block" onclick="openBillModal('โต๊ะ 6')">3</button>
        <button class="table-block" style="width: auto; padding: 0 15px; font-size: 16px;" onclick="openBillModal('สั่งกลับบ้าน')">กลับบ้าน</button>
    </div>
</div>

<!-- Modal สำหรับเช็คบิล -->
<div id="bill-modal" class="modal-overlay" style="display: none;">
    <div class="bill-modal-content">
        <button class="close-modal-btn" onclick="closeBillModal()">✕</button>
        <h3 id="bill-table-name" style="margin-bottom: 15px; color: #333; text-align: center;">โต๊ะ ?</h3>
        
        <div id="bill-items-list" class="bill-items-container"></div>
        
        <div style="border-top: 2px dashed #ccc; padding-top: 15px; margin-top: 10px; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; color: #333;">
            <span>ยอดรวมทั้งสิ้น:</span>
            <span id="bill-total-price" style="color: #d97706;">0 ฿</span>
        </div>
        
        <button id="btn-confirm-clear" class="btn" style="background: #28a745; margin-top: 20px; width: 100%; font-size: 1.1rem; padding: 12px; border-radius: 8px;">
            💰 ลูกค้าโอนเงินแล้ว / ล้างออเดอร์
        </button>
    </div>
</div>
    <!-- 🟢 สิ้นสุดโค้ดใหม่ 🟢 -->

    <!-- ซ่อนพื้นที่พิมพ์สลิป -->
    <div id="print-area"></div>

    <script>
        let previousOrderCount = 0;
        let audioContextAllowed = false;

        // ระบบสร้างเสียงเตือน (Web Audio API)
        function playAlertSound() {
            try {
            // ดึงไฟล์เสียงกระดิ่งจากภายนอก
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3');
            audio.play().catch(e => console.log("Audio play failed:", e));
        } catch(e) {
            console.log("Audio error:", e);
        }
    }

        function enableAudio() {
            audioContextAllowed = true;
            playAlertSound();
            alert("เปิดระบบเสียงเตือนเรียบร้อยแล้วค่ะ!");
        }

        // ดึงเมนูมาจัดการสถานะของหมด
let allStockMenus = [];
let currentStockCategory = ''; // จำหมวดหมู่ที่กำลังเปิดอยู่

async function fetchStockItems() {
    const res = await fetch('/api/menus');
    allStockMenus = await res.json();
    
    renderCategoryButtons();
    
    // หากยังไม่มีการเลือกหมวดหมู่ ให้แสดงหมวดหมู่แรกเป็นค่าเริ่มต้น
    if (!currentStockCategory && allStockMenus.length > 0) {
        currentStockCategory = allStockMenus[0].category;
    }
    renderStockByCategory(currentStockCategory);
}

function renderCategoryButtons() {
    const container = document.getElementById('stock-category-buttons');
    container.innerHTML = '';
    
    // ดึงชื่อหมวดหมู่ทั้งหมดแบบไม่ซ้ำกัน
    const categories = [...new Set(allStockMenus.map(item => item.category))];
    
    categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `cat-tab-btn ${cat === currentStockCategory ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
            currentStockCategory = cat; // จำหมวดหมู่ที่กด
            renderCategoryButtons(); // วาดปุ่มใหม่เพื่ออัปเดตสถานะ active
            renderStockByCategory(cat); // วาดเมนูในหมวดหมู่นั้น
        };
        container.appendChild(btn);
    });
}

function renderStockByCategory(category) {
    const container = document.getElementById('stock-container');
    container.innerHTML = '';

    const filteredMenus = allStockMenus.filter(item => item.category === category);

    filteredMenus.forEach(item => {
        const div = document.createElement('div');
        div.className = 'stock-item';
        div.innerHTML = `
            <span>${item.name}</span>
            <button class="toggle-btn ${item.isAvailable ? 'in-stock' : 'out-stock'}" onclick="toggleStock(${item.id})">
                ${item.isAvailable ? 'มีสินค้า' : 'หมด'}
            </button>
        `;
        container.appendChild(div);
    });
}

async function toggleStock(id) {
    await fetch(`/api/menus/${id}/toggle`, { method: 'PUT' });
    fetchStockItems(); // โหลดข้อมูลใหม่ หน้าจอจะยังอยู่ที่หมวดหมู่เดิม
}

        // ดึงรายการออเดอร์
        async function fetchKitchenOrders() {
            try {
                const res = await fetch('/api/orders');
                const orders = await res.json();
                
                // ตรวจจับออเดอร์ใหม่เพื่อเล่นเสียงเตือน
                if (orders.length > previousOrderCount) {
                    if (previousOrderCount !== 0 && audioContextAllowed) {
                        playAlertSound();
                    }
                    previousOrderCount = orders.length;
                }

                const container = document.getElementById('kitchen-orders');
                container.innerHTML = '';

                orders.slice().reverse().forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.style.borderColor = order.status === 'completed' ? '#28a745' : (order.status === 'cooking' ? '#ff9f43' : '#e74c3c');

                    let itemsHtml = order.items.map(i => `
                        <div class="item-row">
                            <span>${i.name}</span>
                            <b>x${i.quantity}</b>
                        </div>
                    `).join('');

                    let actionBtn = '';
                    if (order.status === 'pending') {
                        actionBtn = `<button class="btn btn-cook" onclick="updateStatus(${order.id}, 'cooking')">🔥 เริ่มปรุงอาหาร</button>`;
                    } else if (order.status === 'cooking') {
                        actionBtn = `<button class="btn btn-done" onclick="updateStatus(${order.id}, 'completed')">✅ ทำเสร็จแล้ว / เสิร์ฟ</button>`;
                    } else {
                        actionBtn = `<div style="text-align:center; color:#28a745; font-weight:bold; margin-top:5px;">เสิร์ฟเรียบร้อยแล้ว</div>`;
                    }

                    card.innerHTML = `
                        <div class="order-header">
                            <div><b>ออเดอร์ #${order.id} (${order.table})</b></div>
                            <span class="tag">${order.diningOption === 'eat-in' ? '🍽️ ทานที่ร้าน' : '🛍️ กลับบ้าน'}</span>
                        </div>
                        <p style="font-size:0.85rem; color:#aaa; margin:5px 0;">เวลา: ${order.time} | ชำระ: ${order.paymentMethod}</p>
                        <div class="order-items">${itemsHtml}</div>
                        ${actionBtn}
                        <button class="btn btn-print" onclick="printReceipt(${order.id})">🖨️ พิมพ์ใบสลิป</button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function updateStatus(id, newStatus) {
            await fetch(`/api/orders/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            fetchKitchenOrders();
        }

        // ฟังก์ชันพิมพ์ใบสั่งอาหาร (Receipt Printer)
        async function printReceipt(orderId) {
            const res = await fetch(`/api/orders/${orderId}`);
            const order = await res.json();
            
            const printArea = document.getElementById('print-area');
            let itemsList = order.items.map(i => `<tr><td>${i.name} x${i.quantity}</td><td style="text-align:right;">${i.price * i.quantity}.-</td></tr>`).join('');
            
            printArea.innerHTML = `
                <div style="width: 250px; font-family: monospace; font-size: 12px;">
                    <h3 style="text-align:center; margin:0;">Fennec Fox Cafe</h3>
                    <p style="text-align:center; margin:2px 0;">--------------------------------</p>
                    <p><b>ออเดอร์: #${order.id}</b> | <b>${order.table}</b></p>
                    <p>ประเภท: ${order.diningOption === 'eat-in' ? 'ทานที่ร้าน' : 'สั่งกลับบ้าน'}</p>
                    <p>เวลา: ${order.time}</p>
                    <p style="text-align:center; margin:2px 0;">--------------------------------</p>
                    <table style="width:100%;">${itemsList}</table>
                    <p style="text-align:center; margin:2px 0;">--------------------------------</p>
                    <p style="font-size: 14px;"><b>ราคารวมทั้งสิ้น: ${order.totalPrice} บาท</b></p>
                    <p>การชำระเงิน: ${order.paymentMethod}</p>
                </div>
            `;
            window.print();
        }

        setInterval(fetchKitchenOrders, 3000);
        fetchStockItems();
        fetchKitchenOrders();

        async function openBillModal(tableName) {
    try {
        // ดึงข้อมูลเฉพาะของโต๊ะนั้นเพื่อมารวมบิล
        const res = await fetch(`/api/orders?table=${encodeURIComponent(tableName)}`);
        const tableOrders = await res.json();
        
        // รวมรายการที่สั่งเหมือนกัน
        const itemMap = {};
        tableOrders.forEach(order => {
            order.items.forEach(item => {
                if (itemMap[item.id]) {
                    itemMap[item.id].quantity += item.quantity;
                } else {
                    itemMap[item.id] = { ...item };
                }
            });
        });

        const aggregatedItems = Object.values(itemMap);
        const totalPrice = aggregatedItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        // นำข้อมูลลงแสดงใน Modal
        document.getElementById('bill-table-name').innerText = `เช็คบิล ${tableName}`;
        
        let itemsHtml = aggregatedItems.map(item => `
            <div class="bill-item-row">
                <span>${item.name} <span style="color: #666; font-size: 13px;">x${item.quantity}</span></span>
                <span>${item.price * item.quantity} ฿</span>
            </div>
        `).join('');
        
        if(aggregatedItems.length === 0) {
            itemsHtml = '<p style="text-align: center; color: #999; padding: 20px 0;">ไม่มีรายการอาหารค้างอยู่</p>';
        }

        document.getElementById('bill-items-list').innerHTML = itemsHtml;
        document.getElementById('bill-total-price').innerText = `${totalPrice} ฿`;
        
        // ตั้งค่าปุ่มกดล้างออเดอร์
        document.getElementById('btn-confirm-clear').onclick = () => clearTableOrders(tableName);
        
        // เปิด Modal
        document.getElementById('bill-modal').style.display = 'flex';
    } catch (err) {
        alert("เกิดข้อผิดพลาดในการดึงข้อมูลบิล");
    }
}

function closeBillModal() {
    document.getElementById('bill-modal').style.display = 'none';
}

async function clearTableOrders(tableName) {
    if (!confirm(`ยืนยันลูกค้าโอนเงินเรียบร้อย และต้องการล้างออเดอร์ของ "${tableName}" ใช่ไหม?`)) return;
    
    try {
        const res = await fetch(`/api/orders/clear/${encodeURIComponent(tableName)}`, { method: 'DELETE' });
        if (res.ok) {
            alert(`✅ เคลียร์บิล ${tableName} เรียบร้อย พร้อมรับลูกค้าใหม่!`);
            closeBillModal();
            fetchKitchenOrders(); // รีเฟรชหน้าจอออเดอร์ครัว
        }
    } catch (err) {
        alert("เกิดข้อผิดพลาด ไม่สามารถล้างโต๊ะได้");
    }
}

    </script>
</body>
</html>
