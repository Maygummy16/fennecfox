<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fennec Fox Cafe - สั่งอาหาร</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header & Dining Options -->
    <header class="header">
        <div class="logo">🦊 Fennec Fox Cafe</div>
        <p class="subtitle">Fresh Coffee • Homemade Bakery</p>
        
        <!-- Dining Option Radio Buttons -->
        <div class="dining-selector">
            <label class="dining-option">
                <input type="radio" name="dining-option" value="eat-in" checked>
                <span>🍽️ ทานที่ร้าน</span>
            </label>
            <label class="dining-option">
                <input type="radio" name="dining-option" value="takeaway">
                <span>🛍️ สั่งกลับบ้าน</span>
            </label>
        </div>
    </header>

    <!-- ปุ่มลอยดูออเดอร์ของฉัน -->
    <button class="my-orders-btn" onclick="openMyOrdersModal()">
        📋 ออเดอร์ของฉัน <span id="orders-badge" class="orders-badge" style="display:none;">0</span>
    </button>

    <!-- Category Filter -->
    <div class="categories">
        <button class="cat-btn active" onclick="filterMenu('all')">ทั้งหมด</button>
        <button class="cat-btn" onclick="filterMenu('food')">🍲 อาหาร</button>
        <button class="cat-btn" onclick="filterMenu('coffee')">☕ กาแฟ</button>
        <button class="cat-btn" onclick="filterMenu('drinks')">🍹 เครื่องดื่ม</button>
    </div>

    <!-- Food Menu Grid -->
    <main class="menu-container" id="menu-container"></main>

    <!-- Floating Cart Bar -->
    <div class="cart-bar" onclick="openCartModal()">
        <div class="cart-info">
            <span class="cart-icon">🛒</span>
            <span id="cart-count">0 รายการ</span>
        </div>
        <div class="cart-total" id="cart-total">0 ฿</div>
    </div>

    <!-- Modal หลัก (รองรับ ตะกร้า / ชำระเงิน / สถานะออเดอร์) -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <!-- ปุ่มปิด ✕ (กดปิดได้ตลอดเวลา) -->
            <button class="close-modal" onclick="closeCartModal()">✕</button>

            <!-- 1. หน้าตะกร้าสินค้า -->
            <div id="step-cart-view">
                <h2>🛒 รายการอาหารในตะกร้า</h2>
                <div id="cart-items-list"></div>
                <div class="modal-footer">
                    <div class="total-row">
                        <span>ราคารวมทั้งหมด:</span>
                        <b id="modal-total-price">0 ฿</b>
                    </div>
                    <button class="checkout-btn" onclick="goToPaymentView()">ดำเนินการชำระเงิน 👉</button>
                </div>
            </div>

            <!-- 2. หน้าชำระเงิน -->
            <div id="step-payment-view" style="display: none;">
                <button class="back-btn" onclick="switchStep('cart')">👈 ย้อนกลับ</button>
                <h2>💳 เลือกช่องทางการชำระเงิน</h2>
                <p>ยอดชำระทั้งสิ้น: <b id="payment-amount" style="color:#d35400;">0 ฿</b></p>
                
                <div class="payment-methods">
                    <label class="pay-card">
                        <input type="radio" name="pay-method" value="promptpay" checked onclick="selectPaymentMethod('promptpay')">
                        <span>📱 สแกน QR PromptPay</span>
                    </label>
                    <label class="pay-card">
                        <input type="radio" name="pay-method" value="cash" onclick="selectPaymentMethod('cash')">
                        <span>💵 ชำระเงินสดที่เคาน์เตอร์</span>
                    </label>
                </div>

                <div id="qr-code-box" style="text-align: center; margin: 15px 0;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=PROMPTPAY_MOCK" alt="QR Code Promptpay" style="border: 2px solid #ddd; border-radius: 8px;">
                    <p style="font-size: 0.85rem; color: #7f8c8d; margin-top: 5px;">สแกนแล้วกดส่งรายการได้เลยค่ะ</p>
                </div>

                <button class="checkout-btn" onclick="submitOrderToBackend()">✅ ยืนยันการสั่งซื้อ</button>
            </div>

            <!-- 3. หน้าสถานะออเดอร์ทั้งหมด -->
            <div id="step-status-view" style="display: none;">
                <h2>🧑‍🍳 สถานะออเดอร์ของคุณ</h2>
                <div id="my-orders-list-container">
                    <!-- รายการออเดอร์จะมาแสดงตรงนี้ -->
                </div>
                <button class="order-more-btn" onclick="closeCartModal()">➕ สั่งอาหารเพิ่ม</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
