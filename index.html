<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fennec Fox Cafe</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    
    <header class="header">
        <h1>🦊</h1>
        <h2>Fennec Fox Cafe</h2>
        <p>Fresh Coffee • Homemade Bakery</p>
    </header>

    <!-- ปุ่มลอยดูออเดอร์ของฉัน -->
    <button class="my-orders-btn" onclick="openMyOrdersModal()">
        📋 ออเดอร์ของฉัน <span id="orders-badge" class="orders-badge" style="display:none;">0</span>
    </button>

    <nav class="categories">
        <button class="cat-btn active" onclick="filterMenu('all')">ทั้งหมด</button>
        <button class="cat-btn" onclick="filterMenu('food')">🍛 อาหาร</button>
        <button class="cat-btn" onclick="filterMenu('coffee')">☕ กาแฟ</button>
        <button class="cat-btn" onclick="filterMenu('drinks')">🥤 เครื่องดื่ม</button>
    </nav>

    <main class="menu-grid" id="menu-container"></main>

    <div class="cart-bar" onclick="openCartModal()">
        <div class="cart-info">
            <span class="cart-icon">🛒</span>
            <span id="cart-count">0 รายการ</span>
        </div>
        <div class="cart-price">
            <span id="cart-total">0 ฿</span>
            <span class="checkout-arrow">➔</span>
        </div>
    </div>

    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-content">
            
            <!-- Step 1: ตะกร้าสินค้า -->
            <div id="step-cart-view">
                <button class="close-modal" onclick="closeCartModal()" aria-label="ปิด">✕</button>
                <h3 class="modal-title">🛒 ตะกร้าสินค้าของคุณ</h3>
                
                <div style="margin-bottom: 15px; background: #f5f5f5; padding: 10px; border-radius: 8px;">
                    <label style="font-weight: 500; display: block; margin-bottom: 5px;">รูปแบบการรับประทาน:</label>
                    <label><input type="radio" name="dining-option" value="eat-in" checked> 🍽️ กินที่ร้าน</label> &nbsp;
                    <label><input type="radio" name="dining-option" value="takeaway"> 🛍️ สั่งกลับบ้าน</label>
                </div>

                <div id="cart-items-list" class="cart-items-list"></div>
                
                <div class="modal-total-row">
                    <span>ยอดรวมทั้งสิ้น</span>
                    <span id="modal-total-price" class="total-price-text">0 ฿</span>
                </div>
                <button class="action-btn" onclick="goToPaymentView()">เลือกวิธีชำระเงิน ➔</button>
            </div>

            <!-- Step 2: เลือกวิธีชำระเงิน -->
            <div id="step-payment-view" style="display: none;">
                <button class="close-modal" onclick="closeCartModal()" aria-label="ปิด">✕</button>
                <h3 class="modal-title">💳 เลือกวิธีชำระเงิน</h3>
                <p class="payment-subtitle">ยอดชำระทั้งหมด <span id="payment-amount" class="highlight-text">0 ฿</span></p>
                
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="action-btn" style="flex: 1; background: #28a745;" onclick="selectPaymentMethod('promptpay')">📲 สแกน QR</button>
                    <button class="action-btn" style="flex: 1; background: #6c757d;" onclick="selectPaymentMethod('cashier')">💵 เงินสด</button>
                </div>

                <div id="qr-code-box" class="qr-box" style="display: none;">
                    <div class="promptpay-header">Prompt Pay</div>
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=FennecFoxCafe" alt="QR Code" class="qr-img">
                    <p class="qr-notice">สแกนจ่ายแล้วกดปุ่มยืนยันด้านล่าง</p>
                </div>

                <button class="action-btn" style="margin-top: 10px;" onclick="submitOrderToBackend()">ยืนยันการสั่งอาหาร ➔</button>
            </div>

            <!-- Step 3: สถานะออเดอร์ -->
            <div id="step-status-view" style="display: none;">
                <button class="close-modal" onclick="closeCartModal()" aria-label="ปิด">✕</button>
                <h3 class="modal-title">👨‍🍳 สถานะออเดอร์ของคุณ</h3>
                
                <!-- คอนเทนเนอร์แสดงหลายออเดอร์ -->
                <div id="my-orders-list-container" style="max-height: 400px; overflow-y: auto; padding-right: 5px;"></div>

                <button class="action-btn secondary-btn" style="margin-top: 20px;" onclick="closeCartModal()">➕ สั่งอาหารเพิ่ม</button>
            </div>

        </div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
